include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

  errors:
    invalid_annotation_target: ignore
    unrelated_type_equality_checks: error
    unnecessary_null_comparison: error
    depend_on_referenced_packages: error

linter:
  rules:
