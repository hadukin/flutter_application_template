name: flutter_application_template
description: A new Flutter project.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.4 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  bloc: ^8.1.4
  flutter_bloc: ^8.1.5
  bloc_concurrency: ^0.2.5
  auto_route: ^8.1.3
  go_router: ^14.2.0
  freezed_annotation: ^2.4.1
  flutter_native_splash: ^2.4.0
  intl: any
  intl_utils: ^2.8.7
  app_links: ^6.1.1
  easy_localization: ^3.0.7

  di:
    path: packages/di
  domain:
    path: packages/domain

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  freezed: ^2.5.2
  build_runner: ^2.4.10
  json_serializable: ^6.8.0
  auto_route_generator: ^8.0.0
  melos: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_gen_runner: ^5.5.0+1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/launcher_icon/
    - assets/translations/

flutter_gen:
  output: lib/generated/
