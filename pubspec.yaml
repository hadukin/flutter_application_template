name: flutter_application_template
description: A new Flutter project.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  bloc: ^9.0.0
  flutter_bloc: ^9.1.0
  bloc_concurrency: ^0.3.0
  auto_route: ^10.0.1
  go_router: ^14.8.1
  freezed_annotation: ^3.0.0
  flutter_native_splash: ^2.4.4
  intl: any
  intl_utils: ^2.8.10
  app_links: ^6.4.0
  easy_localization: ^3.0.7

  di:
    path: packages/di
  domain:
    path: packages/domain

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  freezed: ^3.0.4
  build_runner: ^2.4.15
  json_serializable: ^6.9.4
  auto_route_generator: ^10.0.1
  melos: ^6.3.2
  flutter_launcher_icons: ^0.14.3
  flutter_gen_runner: ^5.10.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/launcher_icon/
    - assets/translations/

