name: flutter_application_template
description: A new Flutter project.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.1

workspace:
  - packages/di
  - packages/domain
  - packages/network
  - packages/storage
  - packages/data
  - packages/use_case

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  bloc: ^9.1.0
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  auto_route: ^10.2.3
  go_router: ^17.0.0
  freezed_annotation: ^3.1.0
  flutter_native_splash: ^2.4.7
  intl: any
  intl_utils: ^2.8.12
  app_links: ^7.0.0
  easy_localization: ^3.0.8
  injectable: ^2.7.1+4

  di:
    path: packages/di
  domain:
    path: packages/domain

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^3.2.3
  build_runner: ^2.10.4
  json_serializable: ^6.11.2
  auto_route_generator: ^10.2.6
  melos: ^7.3.0
  flutter_launcher_icons: ^0.14.4
  flutter_gen_runner: ^5.12.0
  injectable_generator: ^2.12.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/launcher_icon/
    - assets/translations/

melos:
  packages:
    - "packages/**"
  scripts:
    gen:
      run: melos exec -c 1 -- dart run build_runner build --delete-conflicting-outputs
    locale:
      run: fvm dart run easy_localization:generate --source-dir ./assets/lang -f keys -o locale_keys.g.dart && fvm dart run easy_localization:generate --source-dir ./assets/lang --output-file codegen_loader.g.dart
      description: Генерация файлов локализации
      failFast: true
    assets:
      run: fvm dart run build_runner build --delete-conflicting-outputs
      description: Генерация файлов локализации
      failFast: true
    test:
      run: fvm flutter test
      description: Запуск всех тестов в пакетах
